name: Emulator tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build app and test APKs (x86_64 included for the emulator)
        run: gradle assembleDebug assembleDebugAndroidTest -PwithX86=true --stacktrace

      - name: Run instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            timeout 900 adb shell am instrument -w -e notClass com.kowsiq.creativescan.UiSmokeTest com.kowsiq.creativescan.test/androidx.test.runner.AndroidJUnitRunner > instrument.txt 2>&1 || true
            timeout 480 adb shell am instrument -w -e class com.kowsiq.creativescan.UiSmokeTest com.kowsiq.creativescan.test/androidx.test.runner.AndroidJUnitRunner > instrument-ui.txt 2>&1 || true
            mkdir -p test-out
            adb pull /sdcard/Android/data/com.kowsiq.creativescan/files/out/. test-out/ || true
            adb logcat -d -s CSTEST:I AndroidRuntime:E > test-out/logcat.txt || true
            cp instrument.txt instrument-ui.txt test-out/

      - name: Show instrumentation result
        if: always()
        run: |
          cat instrument.txt || true
          echo ---- ui ----
          cat instrument-ui.txt || true
          echo ---- metrics ----
          cat test-out/metrics.txt || true

      - name: Publish test outputs (images and metrics)
        if: always()
        run: |
          cd test-out
          git init -q -b results-api${{ matrix.api-level }}
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "emulator test outputs (api ${{ matrix.api-level }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/results-api${{ matrix.api-level }}

      - name: Fail if any test failed
        run: |
          grep -E "^OK \(" instrument.txt
          grep -E "^OK \(" instrument-ui.txt
